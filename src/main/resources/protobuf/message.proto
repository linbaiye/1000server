    StartDopItemPacket dropItemPacket = 72;
    NpcMenuPacket npcMenuPacket = 73;
    NpcTradeMenuPacket tradeMenuPacket = 74;
    CloseTradeWindowPacket closeTradePacket = 75;
    UpdateTradeWindowSlotPacket updateTradeWindowSlot = 76;
    DynamicObjectSnapshotPacket dynamicObjectSnapshot = 77;
    DynamicObjectShiftPacket dynamicObjectShift = 78;
    FollowRopePacket followRope = 79;
    PillsPacket pills = 80;
    AttributeEquipPacket attributeEquip = 81;
    ActivateEffectPacket activateEffect = 82;
  }
