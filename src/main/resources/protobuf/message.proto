message ShowDynamicObjectPacket {
  int64 id = 1;
  int32 x = 2;
  int32 y = 3;
  int32 type = 4;
  int32 start = 5;
  int32 end = 6;
  string shape = 7;
  int32 elapsed = 8;
  optional string name = 9;
