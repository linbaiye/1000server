syntax = "proto3";

message PositionPacket {
  int32 x = 1;
  int32 y = 2;
  int32 direction = 3;
  int64 id = 4;
}

message NpcMovePacket {
  int64 id = 1;
  int32 direction = 2;
  int32 x = 3;
  int32 y = 4;
  int32 speedMillis = 5;
}

message MonsterMoveEventPacket {
  int64 id = 1;
  int32 direction = 2;
  int32 speed = 3;
  int32 x = 4;
  int32 y = 5;
}

message FollowRopePacket {
  int64 id = 1;
  int32 direction = 2;
  int32 durationMillis = 3;
  int32 x = 4;
  int32 y = 5;
}


message InputResponsePacket {
  int64 sequence = 1;
  PositionPacket positionPacket = 2;
}

message InputPacket {
  int32 type = 1;
  int64 sequence = 2;
  int32 clickedDirection = 3;
}

message ClickInputPacket {
  int64 id = 1;
}

message RightClickPacket {
  int32 type = 1;
  optional int32 slotId = 2;
  optional int32 page = 3;
}

message ClientKeyPressedPacket {
  int32 key = 1;
  int32 x = 2;
  int32 y = 3;
}

message PickItemPacket {
  int32 id = 1;
}

message PlayerLoginPacket {
  string token = 1;
  string charName = 2;
}

message CreatureDieEventPacket {
  int64 id = 1;
}

message CreatureAttackEventPacket {
  int64 id = 1;
  int32 direction = 2;
  int32 state = 3;
  bool player = 4;
  int32 x = 5;
  int32 y = 6;
  optional int32 effectId = 7;
}

message CreatureSoundEventPacket {
  int64 id = 1;
  string sound = 2;
}

message CreatureHurtEventPacket {
  int64 id = 1;
  int32 direction = 2;
  int32 x = 3;
  int32 y = 4;
  int32 afterHurtState = 5;
  int32 currentLife = 6;
  int32 maxLife = 7;
}

message ChangeStatePacket {
  int64 id = 1;
  int32 state = 2;
  int32 direction = 3;
  int32 x = 4;
  int32 y = 5;
}


message MoveEventPacket {
  InputPacket input = 1;
  int32 happenedAtX = 2;
  int32 happenedAtY = 3;
}

message ClientAttackEventPacket {
  int64 sequence = 1;
  int64 targetId = 2;
  int32 state = 3;
  int32 direction = 4;
}


message ClientUnequipPacket {
  int32 type = 1;
}

message ClientToggleKungFuPacket {
  int32 tab = 1;
  int32 slot = 2;
}

message ClientSitDownPacket {
  int32 x = 1;
  int32 y = 2;
}


message ClientStandUpPacket {
  bool padding = 1;
}


message SwapInventorySlotPacket {
  int32 slot1 = 1;
  int32 slot2 = 2;
}

message SwapKungFuSlotPacket {
  int32 slot1 = 1;
  int32 slot2 = 2;
  int32 page = 3;
}

message DoubleClickInventorySlotPacket {
  int32 slot = 1;
}


message DropItemConfirmPacket {
  int32 slot = 1;
  int32 numberLeft = 2;
}


message ShowItemPacket {
  int64 id = 1;
  int32 icon = 2;
  optional int32 number = 4;
  int32 coordinateX = 5;
  int32 coordinateY = 6;
  string name = 7;
  int32 color = 8;
}

message ShowTeleportPacket {
  int64 id = 1;
  int32 coordinateX = 5;
  int32 coordinateY = 6;
  string name = 7;
  int32 shape = 8;
}

message ClientSimpleCommandPacket {
  int32 command = 1;
}


message CharacterKungFuPacket {
  string attackKungFuName = 1;
  int32 attackKungFuLevel = 2;
  int32 attackKungFuType = 3;
}

message ClientTradePlayerPacket {
  int64 targetId = 1;
  int32 slot = 2;
}

message ClientUpdateTradePacket {
  int32 inventorySlot = 1;
  int64 itemNumber = 2;
  int32 type = 3;
  int32 tradeWindowSlot = 4;
}



message ClientTriggerDynamicObjectPacket {
  int64 id = 1;
  int32 useSlot = 2;
}

message ClientSwapKungFuSlotPacket {
  int32 page = 1;
  int32 slot1 = 2;
  int32 slot2 = 3;
}



message ClientBankOperationPacket {
  int32 type = 1;
  int32 fromSlot = 2;
  int32 toSlot = 3;
  int64 number = 4;
  int64 bankerId = 5;
}

message ClientChangeTeamPacket {
  int32 teamNumber = 1;
}

message ClientFoundGuildPacket{
  string name = 1;
  int32 x = 2;
  int32 y = 3;
  int32 inventorySlot = 4;
}

message ClientCreateGuildKungFuPacket {
  int32 attackSpeed = 1;
  int32 life = 2;
  int32 avoidance = 3;
  int32 power = 4;
  int32 recovery = 5;
  int32 innerPower = 6;
  int32 outerPower = 8;
  int32 bodyDamage = 7;
  int32 headDamage = 9;
  int32 armDamage = 11;
  int32 legDamage = 12;
  int32 bodyArmor = 13;
  int32 headArmor = 14;
  int32 armArmor = 15;
  int32 legArmor = 16;
  string name = 17;
  int32 type = 18;
}

message ClientManageGuildPacket {
  int32 type = 1;
  string target = 2;
}

message ClientSubmitQuestPacket {
  int64 id = 1;
  string questName = 2;
}


message ChatInputPacket {
  string text = 1;
}

message ClickEquipmentInputPacket {
  int32 equipType = 1;
}

message ClientPacket {
  oneof Type {
    MoveEventPacket moveEventPacket = 1;
    PlayerLoginPacket loginPacket = 3;
    SwapInventorySlotPacket swapInventorySlotPacket = 5;
    DoubleClickInventorySlotPacket doubleClickInventorySlotPacket = 6;
    PickItemPacket pickItem = 8;
    ClientUnequipPacket unequip = 9;
    ClientToggleKungFuPacket toggleKungFu = 10;
    ClientSitDownPacket sitDown = 11;
    ClientStandUpPacket standUp = 12;
    RightClickPacket rightClick = 15;
    ClientTradePlayerPacket tradeRequest = 16;
    ClientUpdateTradePacket updateTrade = 17;
    ClientBankOperationPacket bankOperation = 24;
    ClientChangeTeamPacket changeTeam = 25;
    ClientFoundGuildPacket foundGuild = 26;
    ClientCreateGuildKungFuPacket createGuildKungFu = 27;
    ClientManageGuildPacket manageGuild = 28;
    ClientSubmitQuestPacket submitQuest = 29;

    DebugPacket debug = 31;
    ClickInputPacket clickPacket = 2;
    MoveInputPacket moveInput = 32;
    TurnInputPacket turnInput = 33;
    SimpleInputPacket simpleInput = 34;
    ClickKungFuInputPacket clickKungFuInput = 35;
    ClickInventorySlotInputPacket clickInventorySlotInput = 36;
    AttackInputPacket attackInput = 37;
    UnequipInputPacket unequipInput = 38;
    SwapKungFuSlotPacket swapKungFuSlotPacket = 39;
    PickInputPacket pickInput = 40;
    DropItemInputPacket dropInput = 41;
    ConfirmDropItemInputPacket confirmDropInput = 42;
    ClickNpcAbilityInputPacket clickNpcAbilityInput = 43;
    BuyItemInputPacket buyItem = 44;
    SellItemInputPacket sellItem = 45;
    DropItemOnEntityInputPacket dropOnEntityInput = 46;
    PlayerTradeStateInputPacket tradeStateInput = 47;
    AddTradeItemInputPacket addPlayerTradeInput = 48;
    UsePillInputPacket usePill = 49;
    ChatInputPacket chat = 50;
    ClickEquipmentInputPacket clickEquipment = 51;
  }
}

message UsePillInputPacket {
  string name = 1;
}

message InterpolationPacket {
  int32 moveAction = 1;
  int32 state = 2;
  int32 elapsedMillis = 5;
  int32 direction = 7;
  int32 x = 8;
  int32 y = 9;
}

message InterpolationsPacket {
  repeated InterpolationPacket interpolations = 1;
}

message InventoryItemPacket {
  string name = 1;
  int32 slotId = 2;
  optional int64 number = 3;
  int32 color = 4;
  int32 icon = 5;
}

message NpcItemPacket {
  string name = 1;
  int32 icon = 2;
  int32 color = 3;
  int32 price = 4;
  bool canStack = 5;
}

message OpenTradeWindowPacket {
  int64 anotherPlayerId = 1;
  int32 slot = 2;
  int64 maxNumber = 3;
  bool passive = 4;
  string itemName = 5;
  string selfName = 6;
  string anotherName = 7;
}

message CloseTradeWindowPacket {

}

message InventoryPacket {
  repeated InventoryItemPacket items = 1;
  bool forceful = 2;
}

message UpdateTradeWindowPacket {
  int32 type = 1;
  optional string name = 2;
  optional int64 number = 3;
  optional int32 slot = 4;
  optional bool self = 5;
  int32 color = 6;
}


message KungFuPacket {
  string name = 1;
  int32 level = 2;
  int32 slot = 3;
  int32 type = 4;
  int32 icon = 5;
}

message TextMessagePacket {
  string text = 1;
  int32 location = 2;
  string color = 3;
  string bgColor = 4;
}



message AttributeEquipPacket {
  repeated string attributes = 1;
  string name = 2;
  string age = 3;
  bool male = 4;
  repeated PlayerEquipPacket equipments = 5;
  bool quietly = 6;
}

message ToggleKungFuPacket {
  string name = 1;
  optional int32 level = 2;
  int64 id = 3;
  bool quietly = 4;
  int32 type = 5;
}

message LifeBarPacket {
  int64 id = 1;
  int32 percent = 2;
}


message TeleportPacket {
  int32 x = 1;
  int32 y = 2;
  string map = 3;
  string bgm = 7;
  string title = 8;
  string resource = 9;
}

message LoginPacket {
  TeleportPacket teleport = 1;
  PlayerInfoPacket info = 2;
  string attackKungFuName = 3;
  optional string footKungFuName = 8;
  repeated InventoryItemPacket inventoryItems = 9;
  repeated KungFuPacket unnamedKungFuList = 11;
  repeated KungFuPacket basicKungFuList = 12;
  optional string protectionKungFu = 13;
  optional string assistantKungFu = 14;
  optional string breathKungFu = 15;
  AttributePacket attribute = 17;
  bool footKungFuCanFly = 18;
}

message KungFuBookPacket {
  repeated KungFuPacket unnamedKungFuList = 1;
  repeated KungFuPacket basicKungFuList = 2;
  bool forceful = 3;
}

message AttributePacket {
  int32 curLife = 1;
  int32 maxLife = 2;
  int32 curPower = 3;
  int32 maxPower = 4;
  int32 curInnerPower = 5;
  int32 maxInnerPower = 6;
  int32 curOuterPower = 7;
  int32 maxOuterPower = 8;
  int32 curEnergy = 9;
  int32 maxEnergy = 10;
  int32 headPercent = 11;
  int32 armPercent = 12;
  int32 legPercent = 13;
}

message PlayerRightClickAttributePacket {
  int32 attackSpeed = 1;
  int32 maxLife = 2;
  int32 avoidance = 3;
  int32 maxPower = 4;
  int32 recovery = 5;
  int32 maxInnerPower = 6;
  int32 maxOuterPower = 8;
  int32 maxEnergy = 10;
  int32 bodyDamage = 7;
  int32 headDamage = 9;
  int32 armDamage = 11;
  int32 legDamage = 12;
  int32 bodyArmor = 13;
  int32 headArmor = 14;
  int32 armArmor = 15;
  int32 legArmor = 16;
  int32 age = 17;
}

message PlayerUnequipPacket {
